[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sft-dpo-homechef-agent"
version = "0.0.0"
description = "HomeChef Booking Agent local small-model post-training: contract scaffold and machine-readable schemas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0.1",
  "jsonschema>=4.23.0",
]

[project.scripts]
homechef-contract-validate = "homechef_booking.validation.contract_validator:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homechef_booking"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
