[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sft-dpo-homechef-agent"
version = "0.0.0"
description = "HomeChef Booking Agent local small-model post-training: contract scaffold and machine-readable schemas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0.1",
  "jsonschema>=4.23.0",
]

[project.scripts]
homechef-contract-validate = "homechef_booking.validation.contract_validator:main"
homechef-eval = "homechef_booking.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
inference = [
  "transformers>=4.45.0",
  "torch>=2.4.0",
  "accelerate>=0.34.0",
  # Phase04 Structured Output (phase04_hf_backend constrained decoding).
  "lm-format-enforcer>=0.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homechef_booking"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "B007", "E402"]
"tests/*" = ["E501", "F841"]
"src/homechef_booking/data/generator.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
