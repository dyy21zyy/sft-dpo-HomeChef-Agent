# Phase 04 DPO LoRA Config — Qwen3-0.6B-Base (continues from SFT adapter)
#
# Training chain (SPEC-required): Base → SFT LoRA → SFT checkpoint → DPO LoRA
#   NOT Base → DPO directly.
#
# This is the HISTORICAL DPO config / non-formal (0.6B). It is preserved for
# reproduction only and is EXCLUDED from the Phase04 formal experiment
# (FORMAL_MODELS=[1.7B, 4B]). It continues from the best SFT checkpoint via
# adapter_name_or_path.
#
# Hyperparameters follow the SPEC-approved DPO values (same as the approved
# dryrun: beta=0.1, sigmoid, lr=5e-6, epochs=1, bf16). Do not change without
# approval.
#
# Dataset: Phase 03 v0.3 frozen (data/processed/dpo/v0.3/).
# Base model: Qwen/Qwen3-0.6B-Base (Phase 02 final selection).

stage: dpo
experiment_class: historical
model_name_or_path: Qwen/Qwen3-0.6B-Base

# Continue from the best SFT checkpoint (SFT adapter source).
# Set to the actual best-SFT checkpoint path after SFT training completes.
adapter_name_or_path: experiments/phase04/sft_qwen3_0_6b/checkpoint-best

# LoRA
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# Template
template: qwen3
enable_thinking: false
mask_history: true

# Sequence
cutoff_len: 2048

# Optimization (SPEC-approved DPO values; frozen historical batch=2)
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1

# Precision
bf16: true
fp16: false

# DPO preference
pref_beta: 0.1
pref_loss: sigmoid

# Datasets (Phase 03 v0.3 frozen)
train_dataset_path: data/processed/dpo/v0.3/train.jsonl
eval_dataset_path: data/processed/dpo/v0.3/val.jsonl

# Output
output_dir: experiments/phase04/dpo_qwen3_0_6b_beta_0_1
