# Phase 04 SFT Training Config — Qwen3-4B-Instruct-2507 (FORMAL)
# SPEC-approved defaults. Do not modify without approval.
#
# Formal boundary: FORMAL_MODELS=[1.7B, 4B], FORMAL_DATASET_VERSION=v0.3.
# model_id is the Phase02 FINAL actual model used for the 4B runs
# (Qwen/Qwen3-4B-Instruct-2507), NOT Qwen3-4B-Base. Per Codex Phase04 Release
# Review: the Phase02 final actual model_id is the sole training-start-point
# source, and the 4B Base/Instruct variant must not be mixed up.

stage: sft
experiment_class: formal
# do_train is execution control (required) — not an experiment hyperparameter.
do_train: true
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507

# LoRA
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# Template: qwen3_nothink is REQUIRED for the Instruct-2507 variant
# (per Codex Phase04 Release Review round 2). Do NOT use template: qwen3 with
# enable_thinking: false for 4B Instruct-2507.
template: qwen3_nothink
train_on_prompt: false
mask_history: true

# Sequence
cutoff_len: 2048

# Optimization (SPEC-approved SFT defaults)
learning_rate: 1.0e-4
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1

# Precision
bf16: true
fp16: false

# Checkpointing
eval_strategy: epoch
save_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
save_total_limit: 2
plot_loss: true

# Datasets (Phase 03 v0.3 frozen: SFT 540/60)
train_dataset_path: data/processed/sft/v0.3/train.jsonl
eval_dataset_path: data/processed/sft/v0.3/val.jsonl

# Output (checkpoint-best is the DPO source checkpoint)
output_dir: experiments/phase04/sft_qwen3_4b
