# Phase 04 SFT Training Config — Qwen3-0.6B-Base
# SPEC-approved defaults. Do not modify without ChatGPT approval.

stage: sft
model_name_or_path: Qwen/Qwen3-0.6B-Base

# LoRA
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# Template
template: qwen3
enable_thinking: false
train_on_prompt: false
mask_history: true

# Sequence
cutoff_len: 2048

# Optimization
learning_rate: 1.0e-4
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1

# Precision
bf16: true
fp16: false

# Checkpointing
eval_strategy: epoch
save_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
save_total_limit: 2
plot_loss: true

# Datasets
train_dataset_path: data/processed/phase03_sft_v0.1_train.jsonl
eval_dataset_path: data/processed/phase03_sft_v0.1_val.jsonl
